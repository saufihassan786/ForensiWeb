# ==============================================================================
# ForensiWeb Database Migration Configuration — Alembic
# ==============================================================================

[alembic]
script_location = alembic
version_locations = %(here)s/alembic/versions
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

# Default placeholder; overridden programmatically by app.core.config.Settings
sqlalchemy.url = postgresql://forensiweb_user:insecure_dev_password_change_in_prod@127.0.0.1:5432/forensiweb

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
