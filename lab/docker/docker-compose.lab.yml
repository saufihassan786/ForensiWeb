# ==============================================================================
# ForensiWeb — Dedicated Lab Docker Compose Manifest (docker-compose.lab.yml)
# ==============================================================================
# Focuses exclusively on the isolated laboratory environment target and collectors.
# Adheres strictly to docs/architecture.md and docs/threat-model.md.
# ==============================================================================

version: "3.8"

services:
  vulnerable-target:
    build:
      context: ../../apps/vulnerable-web-app
      dockerfile: Dockerfile
    container_name: forensiweb-lab-target
    restart: unless-stopped
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      FLASK_ENV: development
      FLASK_APP: app.routes:app
      PORT: 5000
    ports:
      # Bound strictly to localhost loopback
      - "127.0.0.1:5000:5000"
    volumes:
      - ../fixtures/logs:/app/lab/fixtures/logs
      - ../fixtures/docs:/app/lab/fixtures/docs:ro
    networks:
      - forensiweb-lab-net

networks:
  forensiweb-lab-net:
    name: forensiweb-lab-net
    driver: bridge
    internal: true
